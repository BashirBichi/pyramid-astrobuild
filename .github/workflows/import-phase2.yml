name: Import tested NASA Phase 2 source
on:
  push:
    branches: [feature/nasa-datasets-v02]
    paths: ["phase2/**"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply verified delta, run tests, publish changes
        shell: bash
        run: |
          set -euo pipefail
          test -f phase2/COMPLETE || exit 0
          cat phase2/part*.txt | base64 -d >/tmp/phase2.tar.xz
          tar -tJf /tmp/phase2.tar.xz >/dev/null
          mkdir -p /tmp/astrobuild-phase2
          tar -xJf /tmp/phase2.tar.xz -C /tmp/astrobuild-phase2
          python /tmp/astrobuild-phase2/apply_patch.py /tmp/astrobuild-phase2 .
          rm -rf phase2
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m compileall -q app
          pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: official NASA terrain and robotic autonomy research'
          git push origin HEAD:feature/nasa-datasets-v02
