name: Import AstroBuild source
on:
  push:
    branches: [main]
    paths:
      - 'source/part*.b64'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified MVP source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f source/part08.b64 ]; then
            echo 'Archive upload incomplete; skipping.'
            exit 0
          fi
          cat source/part*.b64 | base64 -d > /tmp/astrobuild.tar.xz
          tar -tJf /tmp/astrobuild.tar.xz >/dev/null
          tar -xJf /tmp/astrobuild.tar.xz -C .
          rm -rf source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import AstroBuild MVP source'
            git push
          fi
